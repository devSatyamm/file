<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FileForge - Offline Ready</title>
  <style>
    body {
      background-color: #090a0f;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #12141c;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 36px 32px;
      max-width: 480px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 24px;
      margin: 0 0 12px 0;
      font-weight: 600;
      color: #fff;
    }
    p {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background: #3b82f6;
      color: white;
      text-decoration: none;
      font-weight: 500;
      padding: 10px 24px;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <span style="width: 8px; height: 8px; border-radius: 50%; background: #10b981;"></span>
      100% Offline Mode Active
    </div>
    <h1>FileForge is Ready Offline</h1>
    <p>All engines, conversion utilities, and security safeguards are installed locally on your device. You can safely convert documents, PDFs, images, spreadsheets, and developer assets without any internet connection.</p>
    <a href="/" class="btn">Launch FileForge App</a>
  </div>
</body>
</html>
